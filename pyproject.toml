[project]
name = "audiobook-downloader"
version = "0.1.0"
description = "Download and tag audiobooks from supported websites"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13",
    "brotli>=1.1",
    "mutagen>=1.47",
    "pycryptodomex>=3.20",
    "requests>=2.32",
    "rich>=14.0",
    "yt-dlp>=2025.1",
]

[project.scripts]
audiobook-downloader = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main.py", "utils.py", "scrapers"]
